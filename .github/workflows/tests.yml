name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      TORCH_COMPILE_DISABLE: "1"
      TORCHDYNAMO_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test dependencies
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: python -m pytest
      - name: Check CLI
        run: |
          leaf-finch --write-default /tmp/leaf_finch_config.json
          leaf-finch --list-devices
      - name: Build package
        run: python -m build
